# 在 **Apple Silicon** 上打 macOS 安装包（arm64 dmg）
#
# 为什么必须用 CI 而不能在开发机上打：
#   electron-builder 明确拒绝跨平台构建 mac —— 实测在 Windows 上直接报
#     ⨯ Build for macOS is supported only on macOS, please see
#       https://electron.build/multi-platform-build
#   而且 mac 的"安装包"是 .dmg/.pkg，分别依赖 `hdiutil`/`productbuild`，都是 macOS 专属；
#   签名（codesign）同理。所以只能在 mac 上做，CI 的 `macos-14` 就是 Apple Silicon。
#
# ── 这个工作流能做什么、不能做什么 ──
#
#   能：打出 arm64 的 .app 与 .dmg
#   不能：把工作区数据（Datas/build/runtime，约 608 MB）一起打进去 ——
#        它们在 .gitignore 里，**根本不在仓库里**，CI 拿不到。
#        数据要单独拷给 Mac（见 docs/24 第 9 节）。
#
# ── 签名：配了证书就用真证书，没配就 ad-hoc ──
#
#   ⚠️ 判断"有没有配证书"必须**先取到 env 再在 if 里用 env.\***：
#      GitHub Actions 的 `if:` 在 secrets 注入之前求值，写
#      `if: ${{ secrets.FOO != '' }}` 是不行的。所以下面先用一个
#      "探测"步骤把结果写进 outputs，后面按 outputs 分支。
#
#   没配 Secrets 也能跑：会自动退化成 ad-hoc 签名（`-c.mac.identity=-`）。
#   产出的 dmg 仍可用，但拿到的 Mac 要手动放行一次。
#
# ── 用法 ──
#   推 tag（v*）或在 Actions 页面手动 Run workflow
#
# ── 要正式分发（双击就能开、不弹"无法验证开发者"）──
#   1. Apple Developer Program 会员（$99/年）
#   2. Developer ID Application 证书（.p12）
#   3. Secrets：MAC_CERT_P12 / MAC_CERT_PASSWORD /
#      APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
#   4. 打开 electron-builder-mac.yml 里的 mac.notarize 段并填 teamId
#   完整步骤（含"必须在 Mac 上生成 CSR"这个约束）见 docs/24 第 9.7 节。

name: build-macos-arm64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    # macos-14 = Apple Silicon（arm64）。用 macos-13 会是 Intel，架构不对。
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 启用 pnpm
        run: corepack enable

      - name: 安装依赖
        run: corepack pnpm install --frozen-lockfile

      # ⚠️ 本仓库的 pnpm 不在 PATH 上，`pnpm check` 这类**嵌套调用**会失败，
      #    所以编译/测试都拆开单独跑（与 docs/24 一致）。
      - name: 编译各包
        run: corepack pnpm -r build

      - name: 编译前端
        run: corepack pnpm --filter @aa/web exec vite build

      - name: 自检（typecheck + 单测）
        run: |
          corepack pnpm typecheck
          corepack pnpm test

      - name: 生成 staging（让 @aa/* 裸包名能解析）
        run: node tools/desktop_stage_modules.mjs

      - name: 生成图标
        run: node tools/make_icon.mjs build/icon.png

      # ---------- 签名：先探测，再分支（原因见文件头注释）----------
      - name: 探测是否配了签名证书
        id: cert
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "✓ 检测到 MAC_CERT_P12，将走 Developer ID 签名"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ 未配置 MAC_CERT_P12，将走 ad-hoc 签名（Mac 需手动放行一次）"
          fi

      - name: 导入 Developer ID 证书
        if: steps.cert.outputs.has == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          KCP="$(openssl rand -hex 16)"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KCP" "$KC" >/dev/null
          # runner 上还有别的 keychain，得把自己这个加进搜索列表，否则找不到证书
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: 打包（有证书 → 真签名 + 公证）
        if: steps.cert.outputs.has == 'true'
        working-directory: apps/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --config electron-builder-mac.yml

      - name: 打包（无证书 → ad-hoc）
        if: steps.cert.outputs.has == 'false'
        working-directory: apps/desktop
        env:
          # 没有证书时别让 electron-builder 去翻钥匙串
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --arm64 \
            --config electron-builder-mac.yml \
            -c.mac.identity=-

      - name: 签名结果自检
        working-directory: apps/desktop
        run: |
          APP=$(ls -d ../../build/desktop-mac/mac-arm64/*.app | head -1)
          echo "── 签名校验 ──"
          codesign --verify --deep --strict --verbose=2 "$APP" || true
          echo "── 签名身份 ──"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
          echo "── Gatekeeper 评估（未公证时非 0 属预期）──"
          spctl --assess --type execute --verbose=4 "$APP" || true

      # 确认包内没有缺失的第三方依赖（打包只搬 @aa/*，见 docs/24 §8.4）
      - name: 校验包内运行时依赖
        run: |
          APP=$(ls -d build/desktop-mac/mac-arm64/*.app | head -1)
          node tools/desktop_dep_scan.mjs "$APP/Contents/Resources/app"

      - name: 列出产物
        run: ls -lh build/desktop-mac/

      - uses: actions/upload-artifact@v4
        with:
          name: ArticleAgent-macOS-arm64
          path: |
            build/desktop-mac/*.dmg
            build/desktop-mac/*.zip
          if-no-files-found: error
