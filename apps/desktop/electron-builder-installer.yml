# electron-builder 配置：**医生安装包**（NSIS，单文件 setup.exe）
#
# 与 `electron-builder.yml`（便携版）的分工：
#   electron-builder.yml            → 单文件便携 exe，**不带数据**，给开发者/演示用
#   本文件                           → NSIS 安装包，**带数据**（最近一次抽取结果 + 原文 PDF）
#
# 关键取舍：
#
#   1. **perMachine: false（按用户安装）**。
#      默认装到 `%LOCALAPPDATA%\Programs\Article Agent`，这个位置**当前用户可写**。
#      为什么必须是可写的：核对记录写在 `<安装目录>\build\annotations\` 与
#      `build\adjudications\`，装到 Program Files 下普通用户写不进去，一核对就报错。
#
#   2. **extraFiles 而不是 extraResources**。
#      `extraResources` 会落到 `resources\` 下，而主进程是按"exe 所在目录"
#      （`dirname(app.getPath('exe'))`）找工作区的（见 main.mjs 的 resolveWorkspace）。
#      `extraFiles` 正好落在 **exe 旁边**，于是 `Datas/ build/ runtime/` 一眼就被认出来，
#      **不需要改一行主进程代码**。
#
#   3. 数据来自 `build/desktop-payload/`，由 `node tools/desktop_installer.mjs` 生成。
#      ⚠️ 那个脚本**必须**先跑；它同时也是"不带 API key"的唯一保证
#      （`runtime/llm.local.json` 里是真实密钥，绝不能进安装包）。
#
#   4. `deleteAppDataOnUninstall: false` —— 卸载时保留 `%APPDATA%\article-agent`
#      （上次选的工作区、日志）。⚠️ 但**安装目录里**的核对记录仍会被卸载删掉，
#      所以包内附了「备份我的核对记录.bat」。
#
# ⚠️ 路径基准是「项目目录」（= apps/desktop），不是本文件所在目录。

appId: com.articleagent.desktop
productName: Article Agent
copyright: Article Agent
electronVersion: 44.3.0
electronDist: ../../node_modules/electron/dist

directories:
  output: ../../build/desktop-installer
  buildResources: ../../build

win:
  target:
    - target: nsis
      arch: [x64]
  icon: ../../build/icon.png
  artifactName: ArticleAgent-${version}-setup.exe

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Article Agent
  # 卸载时保留 %APPDATA%\article-agent（工作区指针与日志），别把用户配置也带走
  deleteAppDataOnUninstall: false
  artifactName: ArticleAgent-${version}-setup.exe
  # 中文安装界面（NSIS 自带的简体中文语言包）
  installerLanguages:
    - zh_CN
  language: '2052'

forceCodeSigning: false
asar: false

files:
  - main.mjs
  - package.json
  - from: ../web/dist
    to: apps/web/dist
  - from: ../web
    to: apps/web
    filter:
      - server.mjs
  - from: ../../tools
    to: tools
    filter:
      - '**/*.mjs'
  - from: ../../packages/core/dist
    to: packages/core/dist
  - from: ../../packages/ingest/dist
    to: packages/ingest/dist
  - from: ../../packages/skills/dist
    to: packages/skills/dist
  - from: ../../packages/crossref/dist
    to: packages/crossref/dist
  - from: ../../packages/europepmc/dist
    to: packages/europepmc/dist
  - from: ../../build/desktop-stage/node_modules
    to: node_modules

# ★ 数据：落在 exe 旁边（安装目录根），被 resolveWorkspace 的
#   `dirname(app.getPath('exe'))` 直接认出来
extraFiles:
  - from: ../../build/desktop-payload
    to: .

compression: normal
